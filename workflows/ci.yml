name: CI/CD DevSecOps Pipeline

# Pipeline CI/CD realizujący zasady DevSecOps (Shift-Left Security) dla
# podatnej aplikacji webowej OWASP Juice Shop:
#   Etap 1  - budowanie aplikacji i obrazu Docker
#   Etap 2  - testy bezpieczeństwa: SCA, SAST, Secrets, DAST
#   Etap 3  - skan obrazu kontenera (Trivy) PRZED publikacją
#   Etap 4  - push obrazu do publicznego rejestru kontenerów (ghcr.io)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/juice-shop
  IMAGE_TAG: latest-${{ github.sha }}

jobs:
  
  # ======================================================================
  # ETAP 1 — Budowanie obrazu Docker (raz, współdzielony dalej)
  # ======================================================================
  build:
  name: "Build Docker image"
  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v4

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Multi-arch build
      run: |
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache,mode=max \
          -t app:ci \
          --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          --build-arg VCS_REF=${{ github.sha }} \
          --output type=docker \
          .

    - name: upload docker image as artifact
      run: docker save app:ci -o image.tar

    - uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar
