name: CI/CD DevSecOps Pipeline

# Pipeline CI/CD realizujący zasady DevSecOps (Shift-Left Security) dla
# podatnej aplikacji webowej OWASP Juice Shop:
#   Etap 1  - budowanie aplikacji i obrazu Docker
#   Etap 2  - testy bezpieczeństwa: SCA, SAST, Secrets, DAST
#   Etap 3  - skan obrazu kontenera (Trivy) PRZED publikacją
#   Etap 4  - push obrazu do publicznego rejestru kontenerów (ghcr.io)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/juice-shop
  IMAGE_TAG: latest-${{ github.sha }}

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
