
name: DevSecOps Pipeline



on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/juice-shop-devsecops

jobs:
  build:
    name: "Etap 1 — Build Docker"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: |
          docker build -t app:ci \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg VCS_REF=${{ github.sha }} .
      - name: upload image 
        run: docker save app:ci -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

# ======================================================================
  # run trivy scanner 
# ======================================================================
  trivy:
    name: "SCA (Trivy)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Trivy — scanner (HIGH,CRITICAL)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" \
            aquasec/trivy:latest image --input /work/image.tar \
            --severity HIGH,CRITICAL --scanners vuln --no-progress \
            --format table --output /work/trivy-report.txt
          docker run --rm -v "${{ github.workspace }}:/work" \
            aquasec/trivy:latest image --input /work/image.tar \
            --severity HIGH,CRITICAL --scanners vuln --no-progress \
            --format sarif --output /work/trivy.sarif || true
          echo "## Trivy — scanner (HIGH,CRITICAL)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 50 trivy-report.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: |
            trivy-report.txt
            trivy.sarif
