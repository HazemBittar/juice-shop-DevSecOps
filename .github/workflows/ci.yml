
name: DevSecOps Pipeline



on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/juice-shop-devsecops

jobs:

  # ======================================================================
  # lint dockerfile
  # ======================================================================
  
  dockerfile-lint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: info
  

   # --------------------------------------------------------------------------
  fs-scan:
    name: Trivy (filesystem + config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem (vuln + secret)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy config (IaC misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

  iac-scan:
    name: Checkov (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile
          quiet: true
          # Report-only: the repo intentionally includes insecure demo manifests
          # (OPA negative-test fixtures + illustrative IaC). Findings are printed;
          # enforcement is handled by the OPA/Conftest policy job.
          soft_fail: true      
  
  
  
  sca:
    name: "run SCA (npm audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: update lockfile 
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: npm audit (High/Critical)
        run: |
          echo "## SCA — npm audit (High/Critical)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high || true
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json');const m=a.metadata.vulnerabilities;console.log('| level | number |\n|---|---|\n| critical | '+m.critical+' |\n| high | '+m.high+' |\n| moderate | '+m.moderate+' |')" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: sca-npm-audit
          path: npm-audit.json


   # ======================================================================
  # Run — SAST:(Semgrep)
  # ======================================================================
  sast:
    name: "Run — SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (OWASP Top Ten + JS/TS)
        run: |
          semgrep --config p/owasp-top-ten --config p/javascript --config p/typescript \
                  --config p/secrets --metrics off --sarif --output semgrep.sarif \
                  --exclude frontend/dist --exclude node_modules . || true
          semgrep --config p/owasp-top-ten --config p/javascript --config p/typescript \
                  --config p/secrets --metrics off --json --output semgrep.json \
                  --exclude frontend/dist --exclude node_modules . || true
          echo "## SAST — Semgrep" >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./semgrep.json');const n=r.results.length;const err=r.results.filter(x=>x.extra.severity==='ERROR').length;console.log('Znaleziska: '+n+' (w tym ERROR/High: '+err+')')" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep
          path: |
            semgrep.sarif
            semgrep.json
      - name: upload SARIF do GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ======================================================================
  # Run — Secrets Scan:(Gitleaks)
  # ======================================================================
  secrets:
    name: "scan — Secrets (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks 
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest dir /repo \
            --report-format sarif --report-path /repo/gitleaks.sarif --redact -v || true
          echo "## Secrets — Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          node -e "try{const r=require('./gitleaks.sarif');const n=r.runs[0].results.length;console.log('Secret detected: '+n)}catch(e){console.log('raport ')}" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-gitleaks
          path: gitleaks.sarif

  # ─── STAGE 3 : Secrets Detection ──────────────────────────────────────────
  secrets-scan:
    name: "Secrets Detection (TruffleHog)"
    runs-on: ubuntu-latest
    # needs: test
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified --json

      - name: Save secrets report
        if: always()
        run: |
          echo '{"scanned_at":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'","findings":[]}' > secrets-report.json

      - name: Upload secrets report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-report
          path: secrets-report.json

 # ======================================================================
  # Build Docker Image
  # ======================================================================

  build:
    name: "Build Docker"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: |
          docker build -t app:ci \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg VCS_REF=${{ github.sha }} .
      - name: upload image 
        run: docker save app:ci -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

# ======================================================================
  # run trivy scanner 
# ======================================================================
  trivy:
    name: "SCA (Trivy)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Trivy — scanner (HIGH,CRITICAL)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" \
            aquasec/trivy:latest image --input /work/image.tar \
            --severity HIGH,CRITICAL --scanners vuln --no-progress \
            --format table --output /work/trivy-report.txt
          docker run --rm -v "${{ github.workspace }}:/work" \
            aquasec/trivy:latest image --input /work/image.tar \
            --severity HIGH,CRITICAL --scanners vuln --no-progress \
            --format sarif --output /work/trivy.sarif || true
          echo "## Trivy — scanner (HIGH,CRITICAL)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 50 trivy-report.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: |
            trivy-report.txt
            trivy.sarif



  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: /work/image.tar
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error



  sbom:
    name: SBOM Report (Syft)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Generate SBOM (Syft) from saved image
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" anchore/syft:latest \
            docker-archive:/work/image.tar -o spdx-json > /work/sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error
  